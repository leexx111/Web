<script>

    function getRoomNameByDeviceName(deviceName) {
        if (!deviceName) {
            return '未知配电室';
        }
        if (deviceName.startsWith('2-')) {
            return '2号配电室';
        }
        if (deviceName.startsWith('6-')) {
            return '6号配电室';
        }
        return '1号配电室';
    }

    function showAlarmPopup(araemName, message, alarmId, eventType, pointKey) {
        playAlertSound();

        const safeName = araemName || (pointKey ? pointKey.split('.')[0] : '未知设备');
        const roomName = getRoomNameByDeviceName(safeName);
        const now = new Date();
        const localTime = now.toLocaleString();
        const isRecoverEvent = eventType === 'recover';
        const popupTitle = isRecoverEvent ? '恢复提示' : '报警提示';
        const popupText = safeName + ' ' + message;

        layer.open({
            type: 1,
            title: '<i class="fa fa-bell text-danger"></i>' + roomName + ' ' + safeName + ' ' + popupTitle,
            content: '<div class="p-15" style="padding: 10px">' +
                '<div class="text-center mb-15">' +
                '<i class="fa fa-exclamation-triangle text-danger" style="font-size: 60px;"></i>' +
                '</div>' +
                '<div class="text-center text-danger font-size-18 mb-10">' + popupText + '</div>' +
                '<div class="text-center mb-15">报警时间: <span class="font-weight-bold">' + localTime + '</span></div>' +
                '<div class="text-center text-muted">请立即检查设备状态</div>' +
                '</div>',
            area: ['400px', '300px'],
            skin: 'layui-layer-danger',
            btn: ['确认', '忽略'],
            btn1: function(index, layero) {
                if (alarmId && !isRecoverEvent) {
                    ubdateAlarm(alarmId);
                }
                layer.close(index);
                layer.msg(isRecoverEvent ? '恢复信息已确认' : '报警已确认', {icon: 1});
                pauseAlertSound();
            },
            btn2: function(index, layero) {
                layer.close(index);
                layer.msg(isRecoverEvent ? '恢复信息已关闭' : '报警已忽略', {icon: 3});
                pauseAlertSound();
            },
            success: function(layero, index) {
                layero.find('.layui-layer-title').addClass('pulse-animation');
            }
        });
    }


    let pollingActive = true; // 轮询状态标志
    let currentAlarmId = null; // 当前处理中的报警ID

    function ubdateAlarm(id){
        $.ajax({
            url: "/hdb/updatealarmById",
            data: {
                alarmId : id
            },
            success: function (response) {
                console.log("接口调用成功，返回数据：", response);

            },
            error: function (error) {
                console.error("接口调用失败：", error);
            }
        });
    }

    // 播放提示音函数
    function playAlertSound() {
        alertSound.currentTime = 0;
        console.log("开始播放")
        alertSound.play().catch(error => {
            console.error('播放提示音失败:', error);
        });
    }

    // 暂停提示音函数
    function pauseAlertSound() {
        alertSound.pause();
        console.log("暂停播放")
        // 重置音频位置（可选，方便下次播放从开头开始）
        alertSound.currentTime = 0;
    }


    // 连接 WebSocket 服务器
    let socket;
    let closingSocket = false;
    let reconnectTimer;
    function connectAlarmSocket() {
    socket = new WebSocket((window.location.protocol === 'https:' ? 'wss://' : 'ws://') + window.location.host + '/ws');

    // 连接成功时触发
    socket.onopen = function(event) {
        console.log('WebSocket 连接已建立');
        // socket.send('Hello, server!');
    };

    // 收到消息时触发
    socket.onmessage = function(event) {
        // console.log('收到消息: ' + event.data);
        // 处理服务器返回的数据 如果消息为有报警，则弹窗
        try {
            // 解析JSON字符串为JavaScript对象
            const messageObj = JSON.parse(event.data);

            // 直接使用对象中的属性
            console.log('收到消息:', messageObj);
            console.log('消息内容:', messageObj.message);
            console.log('消息名称:', messageObj.name);

            showAlarmPopup(
                messageObj.name,
                messageObj.message,
                messageObj.alarmId,
                messageObj.eventType,
                messageObj.pointKey
            );



        } catch (error) {
            console.error('解析消息失败:', error);
        }
    };

    // 连接关闭时触发
    socket.onclose = function(event) {
        if (!closingSocket) reconnectTimer = setTimeout(connectAlarmSocket, 3000);
        console.log('WebSocket 连接已关闭');
    };

    // 发生错误时触发
    socket.onerror = function(error) {
        console.error('WebSocket 发生错误: ' + error);
    };

    }
    connectAlarmSocket();
    // 页面关闭时关闭连接
    window.onbeforeunload = function() {
        closingSocket = true;
        clearTimeout(reconnectTimer);
        if (socket) socket.close();
    };
</script>
