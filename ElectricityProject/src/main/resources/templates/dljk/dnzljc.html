    function chaxunsj(){
        myChart.dispose();
        myChart = echarts.init(document.getElementById('unit3_dnzljc'));

        var selectElement = document.getElementById('xlsx').value;

            url: '/hdb/getdnzljcsj',

            data: {

                ks:kssj,
                js:nextDay,
                lx:selectElement

                // alert(clwz+"||"+kssj)

                var xAxisData = response.map(function (item) {
                    return item.data;
                });

                // 处理折线数据
                var seriesData = {};
                response.forEach(function (item) {
                    for (var key in item) {
                        if (key!== 'data') {

                            }
                            seriesData[key].push(item[key]);
                        }
                    }
                });

                for (var lineKey in seriesData) {
                    series.push({
                        name: lineKey,
                        type: 'line',
                        data: seriesData[lineKey],

                                },

                            ]

                    });
                    qudename.push(lineKey);
                }
                var optionss = {

                    },

    async function exportToExcel() {
    // 获取选择的测量位置和数据类型（value值如"V"、"A"等）
    const clwz = document.getElementById('pds').value;
    const dataTypeValue = document.getElementById('xlsx').value; // 获取select的value值
    const kssj = document.getElementById('test1').value;
    const jssj = document.getElementById('test2').value;

    // 数据类型映射：将select的value值对应到中文名称和字段标题
    const typeConfig = {
        'V': {
            name: '电压',
            titles: {
                'Uan': 'A相电压(Uan)',
                'Ubn': 'B相电压(Ubn)',
                'Ucn': 'C相电压(Ucn)',
            }
        },
        'A': {
            name: '电流',
            titles: {
                'Ia': 'A相电流(Ia)',
                'Ib': 'B相电流(Ib)',
                'Ic': 'C相电流(Ic)',
            }
        },
        'kvar': {
            name: '有功功率',
            titles: {
                'W': '总有功功率(W)',
                'Wa': 'A相有功功率(Wa)',
                'Wb': 'B相有功功率(Wb)',
                'Wc': 'C相有功功率(Wc)'
            }
        },
        'Kvar': {
            name: '无功功率',
            titles: {
                'Q': '总无功功率(Q)',
                'Qa': 'A相无功功率(Qa)',
                'Qb': 'B相无功功率(Qb)',
                'Qc': 'C相无功功率(Qc)'
            }
        },
        'kva': {
            name: '视在功率',
            titles: {
                'S': '视在功率(S)'
            }
        },
        'kwh': {
            name: '有功电量',
            titles: {
                'Kwh': '总正向有功电量(Kwh)'
            }
        },
        'kvarh': {
            name: '无功电量',
            titles: {
                'KVarh': '总正向无功电量(KVarh)'
            }
        }
    };

    // 获取当前选中类型的配置（中文名称和字段标题）
    const currentConfig = typeConfig[dataTypeValue];
    if (!currentConfig) {
        alert('未找到对应的数据类型配置');
        return;
    }

    // 获取要导出的数据（与查询接口一致）
    try {
        const response = await $.ajax({
            url: '/hdb/getdnzljcsj',
            method: 'POST',
            data: {
                wz: clwz,
                ks: kssj,
                js: jssj,
                lx: dataTypeValue // 发送select的value值（如"V"、"A"）
            }
        });

        // 创建Excel工作簿
        const workbook = new ExcelJS.Workbook();
        
        // 设置工作簿默认字体
        workbook.views = [{
            showGridLines: true,
            defaultFont: {
                name: '宋体',
                size: 11
            }
        }];

        // 创建工作表（使用中文名称作为表名）
        const worksheet = workbook.addWorksheet(`${currentConfig.name}数据`);
        
        // 定义对齐样式
        const centerAlign = { horizontal: 'center', vertical: 'middle' };
        const leftAlign = { horizontal: 'left', vertical: 'middle' };

        // 添加标题行（使用中文名称显示）
        worksheet.mergeCells('A1:F1');
        worksheet.getCell('A1').value = `${clwz} ${kssj}至${jssj} ${currentConfig.name}数据报表`;
        worksheet.getCell('A1').font = { bold: true, size: 14, name: '宋体' };
        worksheet.getCell('A1').alignment = centerAlign;

        // 添加当前时间
        const now = new Date();
        const formattedDate = `${now.getFullYear()}-${(now.getMonth() + 1).toString().padStart(2, '0')}-${now.getDate().toString().padStart(2, '0')}`;
        worksheet.mergeCells('A2:F2');
        worksheet.getCell('A2').value = `导出时间: ${formattedDate}`;
        worksheet.getCell('A2').font = { name: '宋体', size: 11 };
        worksheet.getCell('A2').alignment = leftAlign;

        // 生成表头（第一列为时间，后续为对应数据字段）
        const headerRow = ['时间'];
        Object.values(currentConfig.titles).forEach(title => {
            headerRow.push(title);
        });
        
        // 设置表头样式
        const headerCells = worksheet.addRow(headerRow);
        headerCells.eachCell(cell => {
            cell.font = { bold: true, name: '宋体', size: 11 };
            cell.alignment = centerAlign;
            // 设置边框
            cell.border = {
                top: { style: 'thin' },
                left: { style: 'thin' },
                bottom: { style: 'thin' },
                right: { style: 'thin' }
            };
        });

        // 填充数据
        response.forEach(item => {
            const rowData = [item.data]; // 第一列固定为时间
            
            // 按当前类型的字段填充数据
            Object.keys(currentConfig.titles).forEach(key => {
                rowData.push(item[key] !== undefined ? item[key] : '');
            });
            
            // 添加行到工作表
            const row = worksheet.addRow(rowData);
            
            // 设置单元格样式
            row.eachCell(cell => {
                cell.font = { name: '宋体', size: 11 };
                cell.alignment = cell.col === 1 ? leftAlign : centerAlign;
                // 设置边框
                cell.border = {
                    top: { style: 'thin' },
                    left: { style: 'thin' },
                    bottom: { style: 'thin' },
                    right: { style: 'thin' }
                };
            });
        });

        // 调整列宽
        worksheet.columns.forEach((column, index) => {
            column.width = index === 0 ? 20 : 15; // 时间列更宽
        });

        // 生成Excel文件并下载（文件名使用中文名称）
        const buffer = await workbook.xlsx.writeBuffer();
        saveAs(new Blob([buffer], {
            type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
        }), `${clwz}_${currentConfig.name}_${kssj}_to_${jssj}.xlsx`);

    } catch (error) {
        console.error('导出Excel失败:', error);
        alert('导出Excel失败，请重试');
    }
}
    layui.use('laydate', function(){
        var laydate = layui.laydate;
        var today = new Date();
        var thirtyDaysAgo = new Date(today);
        thirtyDaysAgo.setDate(today.getDate() - 30);

        function formatDate(date) {
            var year = date.getFullYear();
            var month = (date.getMonth() + 1).toString().padStart(2, '0');
            var day = date.getDate().toString().padStart(2, '0');
            return year + '-' + month + '-' + day;
        }

        var currentDate = formatDate(today);
        var currentDates = formatDate(thirtyDaysAgo);
