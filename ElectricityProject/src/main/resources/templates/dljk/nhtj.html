        function formatDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        const formattedDates = formatDate(thirtyDaysAgo);

        document.getElementById('startDate').value = formattedDates;

    // 树形结构渲染函数
    function renderTree(data, container, parentNode = null) {
        // 容错处理：确保数据和容器有效
        if (!data || !Array.isArray(data) || !container) return;
        
        container.innerHTML = '';
        
            
        // 如果有父节点且当前节点有子项，添加全选开关
        if (parentNode && data.length > 0) {
            const checkAllContainer = document.createElement('div');
            checkAllContainer.className = 'checkbox-container';
            checkAllContainer.innerHTML = `
                <div class="node-checkbox" data-check-all></div>
                <div class="check-all-text">全选</div>
            `;
            container.appendChild(checkAllContainer);
            
            // 全选事件
            const checkAllCheckbox = checkAllContainer.querySelector('[data-check-all]');
            checkAllCheckbox.addEventListener('click', function() {
                this.classList.toggle('checked');
                const isChecked = this.classList.contains('checked');
                
                // 选择当前层级子节点复选框
                const childCheckboxes = container.querySelectorAll('.tree-node > .node-content > .node-checkbox');
                
                childCheckboxes.forEach(checkbox => {
                    if (isChecked) {
                        checkbox.classList.add('checked');
                        checkbox.setAttribute('data-checked', 'true');
                    } else {
                        checkbox.classList.remove('checked');
                        checkbox.setAttribute('data-checked', 'false');
                    }
                });
            });
        }
        
        data.forEach(node => {
            // 节点数据容错
            if (!node) return;
            
            // 创建节点容器
            const nodeEl = document.createElement('div');
            nodeEl.className = 'tree-node';
            nodeEl.dataset.id = node.id || 'node-' + Date.now(); // 确保有唯一ID
            nodeEl.dataset.node = JSON.stringify(node);
            
            // 节点标题容错处理
            const nodeTitle = node.title || node.name || `未命名节点(${node.id || ''})`;
            
            // 节点内容结构
            nodeEl.innerHTML = `
                <div class="node-content">
                    <div class="node-checkbox" data-node-id="${node.id || ''}" data-checked="false"></div>
                    <div class="node-icon">${node.children && node.children.length ? '+' : ''}</div>
                    <div class="node-info">
                        <div class="node-title">${nodeTitle}</div>
                    </div>
                </div>
                <div class="tree-children"></div>
            `;
            
            container.appendChild(nodeEl);
            
            // 递归渲染子节点
            if (node.children && Array.isArray(node.children) && node.children.length > 0) {
                const childrenContainer = nodeEl.querySelector('.tree-children');
                const iconEl = nodeEl.querySelector('.node-icon');

                // 默认展开：id 为 1/2/3/4，或节点自身 open === true
                const defaultOpenIds = ['1', '2', '3', '4', 1, 2, 3, 4];
                const shouldOpen = defaultOpenIds.includes(node.id) || node.open === true;

                if (shouldOpen) {
                    nodeEl.classList.add('open');
                    childrenContainer.style.display = 'block';
                    iconEl.textContent = '-';
                } else {
                    childrenContainer.style.display = 'none';
                    iconEl.textContent = '+';
                }

                renderTree(node.children, childrenContainer, node);

                iconEl.addEventListener('click', (e) => {
                    e.stopPropagation();
                    nodeEl.classList.toggle('open');
                    childrenContainer.style.display = nodeEl.classList.contains('open') ? 'block' : 'none';
                    iconEl.textContent = nodeEl.classList.contains('open') ? '-' : '+';
                });
            }

            // 节点复选框事件
            const nodeCheckbox = nodeEl.querySelector('.node-checkbox');
            nodeCheckbox.addEventListener('click', (e) => {
                e.stopPropagation();
                const isChecked = !nodeCheckbox.classList.contains('checked');
                if (isChecked) {
                    nodeCheckbox.classList.add('checked');
                    nodeCheckbox.setAttribute('data-checked', 'true');
                } else {
                    nodeCheckbox.classList.remove('checked');
                    nodeCheckbox.setAttribute('data-checked', 'false');
                }
            });
            
            // 节点点击事件
            nodeEl.querySelector('.node-content').addEventListener('click', () => {
                document.querySelectorAll('.tree-node').forEach(el => el.classList.remove('active'));
                nodeEl.classList.add('active');
            });
        });
    }

    // 初始化树形菜单 - 确保DOM加载完成后执行
    document.addEventListener('DOMContentLoaded', function() {
        // 查找树形容器
        const treeRoot = document.getElementById('treeRoot');
        
        // 容器存在性检查
        if (!treeRoot) {
            console.error('未找到树形结构容器，请确保存在id为"treeRoot"的元素');
            return;
        }
        
        // 渲染树形菜单
        window.initEnergyTree().catch(function(e){ treeRoot.textContent='树结构加载失败：'+e.message; }); 

        // 查询按钮事件
        const chaxunBtn = document.getElementById('chaxun');
        if (chaxunBtn) {
            chaxunBtn.addEventListener('click', function() {
                selectedNodesInfo = []; // 清空之前的选择
                let skippedCount = 0; // 记录跳过的节点数量

                selectedNodesInfo = window.getEnergySelectedNodes ? window.getEnergySelectedNodes() : [];

                if (skippedCount > 0) {
                    layui.layer.msg(`已自动跳过${skippedCount}个无数据的节点`, {icon: 1, time: 2000});
                }

                if (selectedNodesInfo.length === 0) {
                    if (window.layer) {
                        layer.msg('请至少选择一个节点', {icon: 3});
                    } else {
                        alert('请至少选择一个节点');
                    }
                    return;
                }
                
                const cmsname = selectedNodesInfo.map(node => node.extraInfo);
                console.log('选中节点:', cmsname);
                
                // 日期处理
                const startDateValue = document.getElementById('startDate')?.value;
                const startTimeValue = document.getElementById('endDate')?.value;
                const endDateValue = document.getElementById('startDates')?.value;
                const endTimeValue = document.getElementById('endDates')?.value;

                function normalizeDateTime(dateStr, timeStr) {
                    if (!dateStr || !timeStr) return '';

                    const timeParts = timeStr.split(':');
                    const hour = (timeParts[0] || '00').padStart(2, '0');
                    const minute = (timeParts[1] || '00').padStart(2, '0');

                    const minuteNumber = parseInt(minute, 10);
                    if (Number.isNaN(minuteNumber)) return '';

                    const minuteTens = Math.floor(parseInt(minute, 10) / 10) * 10;
                    const normalizedMinute = String(minuteTens).padStart(2, '0');

                    return `${dateStr} ${hour}:${normalizedMinute}:00`;
                }

                const startDate = normalizeDateTime(startDateValue, startTimeValue);
                const endDate = normalizeDateTime(endDateValue, endTimeValue);


                if (!startDate || !endDate) {
                    if (window.layer) {
                        layer.msg('请选择完整的日期范围', {icon: 3});
                    } else {
                        alert('请选择完整的日期范围');
                    }
                    return;
                }
                const pdsMap = {};
                selectedNodesInfo.forEach(node => {
                    pdsMap[node.extraInfo] = node.pds || '';
                });

                // AJAX请求
                if (window.$) {
                    $.ajax({
                        // url: 'http://192.168.1.227:8081/hdb/getnhtj',
                        url: '/hdb/getnhtj',
                        method: 'POST',
                        data: { cmsname, startDate, endDate, pdsMapJson: JSON.stringify(pdsMap) },
                        success: function(data) {
                            console.log('接口返回数据:', data);
                            // 将选中的节点名称添加到返回数据中
                            if (data && data.length) {
                                const selectedNodeNameMap = {};
                                selectedNodesInfo.forEach(node => {
                                    selectedNodeNameMap[node.extraInfo] = node.name;
                                });

                                data.forEach(item => {
                                    item.电表名称 = selectedNodeNameMap[item.name] || item.name || '';
                                });
                            }
                            xrbg(data);
                        },
                        error: function(xhr) {
                            if (window.layer) {
                                layer.msg('请求失败，请重试', {icon: 2});
                            } else {
                                alert('请求失败，请重试');
                            }
                            console.error('请求错误:', xhr);
                        }
                    });
                } else {
                    console.error('未找到jQuery，请确保已引入');
                }
            });
        } else {
            console.error('未找到查询按钮，请确保存在id为"chaxun"的元素');
        }
    });

    // 渲染表格的方法
    function xrbg(cms) {
        if (window.layui && layui.table) {
            layui.use(['table','layer'], function () {
                const table = layui.table;
                table.render({
                    elem: '#deviceTable',
                    data: cms || [],
                    cols: [
                        [
                            { type: 'numbers', title: '序号', width: 50 },
                            { field: '电表名称', title: '电表名称', width: 250 },
                            { field: '配电室', title: '配电室', width: 120 },
                            { field: '起始日期', title: '起始日期', width: 180 },
                            { field: '起始表读', title: '起始表读', width: 120 },
                            { field: '结束日期', title: '结束日期', width: 180 },
                            { field: '结束表读', title: '结束表读', width: 120 },
                            { field: '采电量(kWh)', title: '采电量(kWh)', width: 140 }
                        ]
                    ],
                    page: true,
                    limit: 50, // 设置默认每页显示20条
                    limits: [10, 20, 50, 100], // 配置可选的每页条数
                    done: function() {
                        if (window.layer) {
                            layer.msg('数据加载完成', {icon: 1, time: 1000});
                        }
                    },
                });
                // 给导出按钮添加点击事件
                document.getElementById('exportBtn').addEventListener('click', function() {
                    const now = new Date();
                    const year = now.getFullYear();
                    const month = String(now.getMonth() + 1).padStart(2, '0');
                    const day = String(now.getDate()).padStart(2, '0');
                    const hours = String(now.getHours()).padStart(2, '0');
                    const minutes = String(now.getMinutes()).padStart(2, '0');
                    const seconds = String(now.getSeconds()).padStart(2, '0');
                    const fileName = `${year}-${month}-${day}_${hours}:${minutes}:${seconds}抄表数据.xlsx`;

                    // 检查是否有数据
                    if (!cms || cms.length === 0) {
                        layer.msg('没有数据可导出', {icon: 3});
                        return;
                    }

                    // 使用ExcelJS创建 workbook
                    const workbook = new ExcelJS.Workbook();
                    const worksheet = workbook.addWorksheet('能耗数据');

                    // 设置列宽
                    worksheet.columns = [
                        { header: '序号', key: 'index', width: 8 },
                        { header: '电表名称', key: 'name', width: 25 },
                        { header: '配电室', key: 'room', width: 15 },
                        { header: '起始日期', key: 'startDate', width: 22 },
                        { header: '起始表读', key: 'startReading', width: 12 },
                        { header: '结束日期', key: 'endDate', width: 22 },
                        { header: '结束表读', key: 'endReading', width: 12 },
                        { header: '采电量(kWh)', key: 'total', width: 15 }
                    ];


                    // 添加表头样式
                    worksheet.getRow(1).font = { bold: true };
                    worksheet.getRow(1).alignment = { vertical: 'middle', horizontal: 'center' };

                    // 添加数据行
                    cms.forEach((item, index) => {
                        worksheet.addRow({
                            index: index + 1,
                            name: item.电表名称 || item.name || '',
                            room: item.配电室 || '',
                            startDate: item.起始日期 || '',
                            startReading: item.起始表读 || '',
                            endDate: item.结束日期 || '',
                            endReading: item.结束表读 || '',
                            total: item['采电量(kWh)'] || ''
                        });
                    });

                    // 导出文件
                    workbook.xlsx.writeBuffer().then(function(buffer) {
                        saveAs(new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), fileName);
                        layer.msg('导出成功', {icon: 1});
                    }).catch(function(error) {
                        console.error('导出失败:', error);
                        layer.msg('导出失败，请重试', {icon: 2});
                    });
                });
            });
        } else {
            console.error('未找到layui或table模块，请确保已正确引入');
        }
    }
