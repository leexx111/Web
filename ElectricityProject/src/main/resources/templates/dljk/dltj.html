    layui.use('laydate', function(){
        var laydate = layui.laydate;
        var queryType = 'month';

        var today = new Date();
        var year = today.getFullYear();
        var month = (today.getMonth() + 1).toString().padStart(2, '0');
        var day = today.getDate().toString().padStart(2, '0');

        var currentDay = year + '-' + month + '-' + day;
        var currentMonth = year + '-' + month;
        var currentYear = String(year);

        function getLaydateType(type) {
            if (type === 'year') return 'year';
            if (type === 'month') return 'month';
            return 'date';
        }

        function getDefaultValue(type) {
            if (type === 'year') return currentYear;
            if (type === 'month') return currentMonth;
            return currentDay;
        }

        function renderPicker(type) {
            laydate.render({
                elem: '#test1',
                type: getLaydateType(type),
                value: getDefaultValue(type)
            });
        }

        renderPicker(queryType);
        localStorage.setItem('myCachedValue', queryType);

        document.getElementById('btn-year').addEventListener('click', function () {
            queryType = 'year';
            renderPicker(queryType);

            this.classList.remove("layui-btn-primary");
            document.getElementById('btn-month').classList.add("layui-btn-primary");
            document.getElementById('btn-day').classList.add("layui-btn-primary");

            localStorage.setItem('myCachedValue', queryType);
        });

        document.getElementById('btn-month').addEventListener('click', function () {
            queryType = 'month';
            renderPicker(queryType);

            this.classList.remove("layui-btn-primary");
            document.getElementById('btn-year').classList.add("layui-btn-primary");
            document.getElementById('btn-day').classList.add("layui-btn-primary");

            localStorage.setItem('myCachedValue', queryType);
        });

        document.getElementById('btn-day').addEventListener('click', function () {
            queryType = 'day';
            renderPicker(queryType);

            this.classList.remove("layui-btn-primary");
            document.getElementById('btn-year').classList.add("layui-btn-primary");
            document.getElementById('btn-month').classList.add("layui-btn-primary");

            localStorage.setItem('myCachedValue', queryType);
        });
    });

    function getTreeDataByPds(pdsValue) {
        if (pdsValue === 'W1#') return treeDataW1;
        if (pdsValue === 'E2#') return treeDataE2;
        if (pdsValue === 'E6#') return treeDataE6;
        return [...treeDataW1, ...treeDataE2, ...treeDataE6];
    }

    function getDefaultCmsByPds(pdsValue) {
        if (pdsValue === 'W1#') {
            return ["1AA1-1", "2AA15-1", "3AA1-1", "4AA17-1"];
        }
        if (pdsValue === 'E2#') {
            return ["2-1AA1-1", "2-2AA14-1", "2-3AA1-1", "2-4AA14-1"];
        }
        if (pdsValue === 'E6#') {
            return ["6-1AA1-1", "6-2AA11-1"];
        }
        return [
            "1AA1-1", "2AA15-1", "3AA1-1", "4AA17-1",
            "2-1AA1-1", "2-2AA14-1", "2-3AA1-1", "2-4AA14-1",
            "6-1AA1-1", "6-2AA11-1"
        ];
    }

    function renderCurrentTree() {
        const pdsValue = document.getElementById('xlsx').value;
        const treeRoot = document.getElementById('treeRoot');
        treeRoot.innerHTML = renderTree(getTreeDataByPds(pdsValue));
        bindTreeEvents();
    }

    // 渲染树形菜单（去除了子项数量徽章）
    function renderTree(data) {
        let html = '<ul class="layui-tree">';

        data.forEach(node => {
            html += `
                <li class="tree-node ${node.open ? 'open' : ''}">
                    <div class="node-content">
                        <input type="checkbox" class="node-checkbox" data-id="${node.id}"
                               data-node='${JSON.stringify(node)}'>
                        <i class="layui-icon node-icon">${node.children ? '&#xe623;' : '&#xe60a;'}</i>
                        <div class="node-info">
                            <div class="node-title" title="${node.name}">${node.name}</div>
                        </div>
                    </div>
                `;

            if (node.children && node.children.length > 0) {
                html += '<div class="tree-children">';
                html += renderTree(node.children);
                html += '</div>';
            }

            html += '</li>';
        });

        html += '</ul>';
        return html;
    }

    function bindTreeEvents() {
        document.querySelectorAll('.node-icon').forEach(icon => {
            icon.addEventListener('click', function(e) {
                e.stopPropagation();
                const parentNode = this.closest('.tree-node');
                const children = parentNode.querySelector('.tree-children');
                if (children) {
                    parentNode.classList.toggle('open');
                    this.innerHTML = parentNode.classList.contains('open') ? '&#xe625;' : '&#xe623;';
                }
            });
        });

        document.querySelectorAll('.node-title').forEach(title => {
            title.addEventListener('click', function(e) {
                e.stopPropagation();
                const parentNode = this.closest('.tree-node');
                const icon = parentNode.querySelector('.node-icon');
                const children = parentNode.querySelector('.tree-children');
                if (children) {
                    parentNode.classList.toggle('open');
                    icon.innerHTML = parentNode.classList.contains('open') ? '&#xe625;' : '&#xe623;';
                }
            });
        });
    }
