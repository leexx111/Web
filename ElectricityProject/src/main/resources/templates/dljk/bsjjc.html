<script>
    $ =layui.jquery;    // 简化后的导航数据
    layui.use('tree', function(){
        const tree = layui.tree;
        const layer = layui.layer;
        tree.render({
            elem: '#navTree',
            data: treedata,
            showLine: true,
            id: 'demoId1',
            accordion: false, // 允许多个父节点展开
            click: function (obj) {
                // obj 包含了被点击节点的相关信息
                // layer.msg(obj.data.title); // 使用 Layui 的 layer 组件弹出提示框，显示节点的 title
                $('.hxtkt').text(obj.data.title);
                dncsbjcs(obj.data.extraInfo);
            }
        });
    });
    //打开页面自动渲染一次
    dncsbjcs("1AA1-1");
    function dncsbjcs(cms){
        localStorage.setItem('bjsjjc',cms);
        layui.use('table', function () {
            var table = layui.table;
            table.render({
                elem: '#dnnjcs',
                url: '/hdb/dnnjcs', // 数据接口
                cols: [[
                    {field: 'number', title: '表计参数',width:'19.8%'},
                    {field: 'zong', title: '总',width:'20%'},
                    {field: 'ady', title: 'A相',width:'20%'},
                    {field: 'dby', title: 'B相',width:'20%'},
                    {field: 'cdy', title: 'C相',width:'20%'},
                ]],
                where: {
                    id: cms, // 自定义参数1，可根据需求修改键名和值
                },
                parseData: function (res) { // 解析数据
                    var dataArray = [];
                    if (res && Array.isArray(res)) {
                        res.forEach(function (innerList) {
                            if (Array.isArray(innerList)) {
                                var rowData = {};
                                innerList.forEach(function (value, index) {
                                    switch (index) {
                                        case 0:
                                            rowData.number = value;
                                            break;
                                        case 1:
                                            rowData.zong = value;
                                            break;
                                        case 2:
                                            rowData.ady = value;
                                            break;
                                        case 3:
                                            rowData.dby = value;
                                            break;
                                        case 4:
                                            rowData.cdy = value;
                                            break;
                                    }
                                });
                                dataArray.push(rowData);
                            }
                        });
                    }
                    return {
                        "code": 0,
                        "msg": "",
                        "count": dataArray.length,
                        "data": dataArray
                    };
                },
                margin: 0,
                // height: '100%'
            });
            table.render({
                elem: '#dnnjcs2',
                url: '/hdb/dnnjcs2', // 数据接口
                cols: [[
                    {field: 'number', title: '零序电流(A)',width:'25%'},
                    {field: 'zong', title: '频率(HZ)',width:'25%'},
                    {field: 'ady', title: '总电压谐波含量(V)',width:'25%'},
                    {field: 'dby', title: '总电流谐波含量(A)',width:'24.8%'},
                ]],
                where: {
                    id: cms, // 自定义参数1，可根据需求修改键名和值
                },
                margin: 0,
                parseData: function (dataFromBackend) {
                    let newData = [
                        {
                            number: dataFromBackend.number,
                            zong: dataFromBackend.zong ,
                            ady: dataFromBackend.ady ,
                            dby: dataFromBackend.dby
                        }
                    ];
                    return {
                        "code": 0, // 解析接口状态
                        "msg": "", // 解析提示文本
                        "count": 1, // 解析数据长度
                        "data": newData // 解析数据列表
                    };
                }
                // height: '100%'
            });
            table.render({
                elem: '#dnnjcs3',

                url: '/hdb/dnnjcs3',
                cols: [[
                    {field: 'number', title: '参数',rowspan:2,width:"30%"},
                    {title: '有功(KWh)',colspan:2},
                    {title: '无功(kVarh)',colspan:2}
                ],[
                    {field: 'yzx', title: '正向',width:"17.5%"},
                    {field: 'yfx', title: '反向',width:"17.5%"},
                    {field: 'wzx', title: '正向',width:"17.5%"},
                    {field: 'wfx', title: '反向',width:"17.4%"}
                ]
                ],

                where: {
                    id: cms, // 自定义参数1，可根据需求修改键名和值
                },
                margin: 0,
                parseData: function (dataFromBackend) {
                    let newData = [
                        {
                            number: dataFromBackend.number,
                            yzx: dataFromBackend.yzx ,
                            wzx: dataFromBackend.wzx ,
                            wfx: dataFromBackend.wfx
                        }
                    ];
                    return {
                        "code": 0, // 解析接口状态
                        "msg": "", // 解析提示文本
                        "count": 1, // 解析数据长度
                        "data": newData // 解析数据列表
                    };
                }
                // height: '100%'
            });
        });
    }

    function csjzdjcf(){
        layui.use('table', function () {
            var table = layui.table;

            table.render({
