spring.application.name=ElectricityProject
server.port=8081
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/yth?useServerPrepStmts=false&useOldAliasMetadataBehavior=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
logging.level.com.serotonin.bacnet4j.util.RequestUtils=WARN
